<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa Vida y Ministerio</title>
<style>
:root{--bd:#000;--bg:#fff;--fg:#000}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1b;--fg:#eee}}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:11pt Calibri,Carlito,"Segoe UI",Arial,sans-serif}
.bar{max-width:900px;margin:0 auto 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input,.bar button{font:inherit;padding:6px 10px}
.wrap{max-width:900px;margin:0 auto;overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse;table-layout:fixed;background:#fff;color:#000}
td{border:1px solid var(--bd);padding:2px 4px;vertical-align:middle;word-wrap:break-word}
tr.sp td{border:0;height:14px;background:var(--bg)}
tbody{break-inside:avoid}
.t{font-weight:bold;text-align:left}.l{font-weight:bold;font-size:10pt;white-space:nowrap}.c{text-align:center}
.wk{background:#2E75B6;color:#fff;font-weight:bold}
.band{text-align:center;color:#fff;font-weight:bold}
.b1{background:#575A5D}.b2{background:#BE8900}.b3{background:#7E0024}
.song{color:#820000}.song2{color:#7E0024}
.cong{font:bold 9pt Arial;text-align:center}.ttl{font:bold 12pt Arial;text-align:center}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cong div{outline:0;padding:3px;min-height:1em}
td.v{padding:0}td.v input,.cong input{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;text-align:center;color:#000;padding:3px}
.msg{padding:20px;text-align:center}
@media print{@page{size:A4;margin:10mm}body{padding:0;background:#fff;font-size:10pt}.bar{display:none}table{min-width:0}td{padding:1px 3px}.l{font-size:9pt}tr.sp td{height:8px}.wrap{overflow:visible}}
</style><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script></head><body>
<div class="bar"><label>Mes: <input type="month" id="m"></label><button id="g" onclick="gen()">Generar mes</button><button onclick="xlsx()">Descargar .xlsx</button><button onclick="print()">Imprimir / PDF</button><span id="st"></span></div>
<div class="wrap" id="out"></div>
<script>
const CONG="Simón Bolívar 14803";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return localStorage.getItem(k)||""}catch{return ""}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let ym,cur;
const inp=k=>`<td class="v"><input data-k="${k}" value="${esc(store.get(k))}"></td>`;
const lbl=(c,t,cls="")=>`<td colspan="${c}" class="l ${cls}">${t}</td>`;
const band=(t,n)=>`<tr><td colspan="12" class="band b${n}">${t}</td></tr>`;
const cols=[4.4,2.4,6.9,9.9,4.7,6.9,9.6,7,5.2,12.9,11.5,18.5];
function week(w,i){
  const p=`vm:${ym}:${i}:`, it=n=>w.items.find(x=>x.n===n);
  const txt=x=>x?esc(`${x.n}. ${x.title} (${x.mins} mins.) ${x.detail}`):"";
  const L=/\d{4}.*\d{4}/.test(w.label)?w.label.replace(/\s*[–—-]\s*/," A "):w.label;
  let h=`<tbody><tr><td colspan="10" class="wk">SEMANA: ${esc(L)} | LECTURA SEMANAL DE LA BIBLIA: ${esc(w.reading)}</td>${lbl(1,"Presidente:")}${inp(p+"pres")}</tr>`;
  h+=`<tr><td colspan="7" class="t">● Canción ${w.intro_song??""} y oración | Palabras de introducción (1 min.)</td><td colspan="3"></td>${lbl(1,"Oración:")}${inp(p+"or1")}</tr>`;
  h+=band("TESOROS DE LA BIBLIA",1);
  for(const n of [1,2,3])h+=`<tr><td colspan="10" class="t">${txt(it(n))}</td>${lbl(1,n==3?"Estudiante:":"Conductor:")}${inp(p+"n"+n)}</tr>`;
  h+=band("SEAMOS MEJORES MAESTROS",2);
  for(const n of [4,5,6])h+=`<tr><td colspan="9" class="t">${txt(it(n))}</td>${lbl(2,"Estudiante/Ayudante:","c")}${inp(p+"n"+n)}</tr>`;
  h+=band("NUESTRA VIDA CRISTIANA",3);
  h+=`<tr><td colspan="11" class="t song">● Canción ${w.living_song??""}</td><td></td></tr>`;
  for(const n of [7,8])h+=`<tr><td colspan="9" class="t">${txt(it(n))}</td>${lbl(2,"Conductor:","c")}${inp(p+"n"+n)}</tr>`;
  h+=`<tr><td colspan="9" class="t">● Palabras de conclusión (3 min.)</td><td colspan="2"></td><td></td></tr>`;
  h+=`<tr><td colspan="9" class="t song2">● Canción ${w.closing_song??""} y oración</td>${lbl(2,"Oración:","c")}${inp(p+"or2")}</tr>`;
  return h+`<tr class="sp"><td colspan="12"></td></tr></tbody>`;
}
const REPO="martepul/vm",WF="actualizar.yml",BR="main",API="https://api.github.com/repos/"+REPO;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const gh=()=>({Accept:"application/vnd.github+json",Authorization:"Bearer "+store.get("vm:token")});
function render(d){
  cur=d;
  $("#out").innerHTML=`<table><colgroup>${cols.map(c=>`<col style="width:${c}%">`).join("")}</colgroup>
  <thead><tr><td colspan="4" class="cong"><div contenteditable data-k="vm:cong">${esc(store.get("vm:cong")||"Congregación: "+CONG)}</div></td><td colspan="8" class="ttl">Programa para la reunión de entre semana</td></tr></thead>${d.weeks.map(week).join("")}</table>`;
}
async function load(){
  ym=$("#m").value; $("#st").textContent="";
  try{const r=await fetch(`data/${ym}.json`,{cache:"no-cache"}); if(!r.ok)throw 0; render(await r.json());}
  catch{$("#out").innerHTML=`<p class="msg">Todavía no hay datos para ${ym}.<br>Pulsa «Generar mes» para pedirlos a wol.jw.org.</p>`}
}
async function gen(){
  const st=$("#st"),btn=$("#g"),mes=$("#m").value;
  if(!store.get("vm:token")){
    const t=prompt("Pega tu token de GitHub (permiso Actions: lectura y escritura sobre "+REPO+"). Solo se guarda en este navegador.");
    if(!t)return; store.set("vm:token",t.trim());
  }
  btn.disabled=true; st.textContent="Pidiendo "+mes+" a GitHub…";
  try{
    const t0=Date.now();
    const r=await fetch(`${API}/actions/workflows/${WF}/dispatches`,{method:"POST",headers:gh(),body:JSON.stringify({ref:BR,inputs:{meses:mes}})});
    if([401,403,404].includes(r.status)){store.set("vm:token","");throw new Error("GitHub rechazó el token; pulsa de nuevo y pega uno válido.")}
    if(r.status!==204)throw new Error("GitHub respondió "+r.status);
    let ok=null;
    for(let i=0;i<40&&ok===null;i++){
      await wait(8000); st.textContent="Descargando datos de WOL… ("+(i+1)*8+" s)";
      const q=await (await fetch(`${API}/actions/workflows/${WF}/runs?event=workflow_dispatch&per_page=5`,{headers:gh()})).json();
      const run=(q.workflow_runs||[]).find(x=>Date.parse(x.created_at)>=t0-15000);
      if(run&&run.status==="completed")ok=run.conclusion==="success";
    }
    if(ok===null)throw new Error("Tarda demasiado; revisa la pestaña Actions de GitHub.");
    if(!ok)throw new Error("La tarea falló; revisa su registro en Actions.");
    const f=await fetch(`${API}/contents/data/${mes}.json?ref=${BR}`,{headers:{...gh(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});
    if(!f.ok)throw new Error("WOL todavía no tiene publicado ese mes.");
    if($("#m").value===mes){ym=mes;render(await f.json());}
    st.textContent="Listo: "+mes;
  }catch(e){st.textContent=e.message}
  btn.disabled=false;
}
const MESES=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
async function xlsx(){
  if(!cur){$("#st").textContent="Primero carga un mes.";return}
  const wb=new ExcelJS.Workbook(),W=[5.43,3,8.43,12.14,5.71,8.43,13.71,8.57,6.43,15.86,12.14,22.71];
  const ws=wb.addWorksheet("Programa",{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.4,bottom:.4,header:.2,footer:.2}}});
  ws.columns=W.map(width=>({width}));
  const th={style:"thin"},B={top:th,bottom:th,left:th,right:th};
  let r=1,need=0;
  const put=(c1,c2,text,o={})=>{
    if(c2>c1)ws.mergeCells(r,c1,r,c2);
    const w=W.slice(c1-1,c2).reduce((a,b)=>a+b,0);
    need=Math.max(need,Math.ceil(String(text).length/(w*.9))*15);
    for(let c=c1;c<=c2;c++){const x=ws.getCell(r,c);x.border=B;if(o.fill)x.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF"+o.fill}}}
    const x=ws.getCell(r,c1);x.value=text;
    x.font={name:o.font||"Calibri",size:o.size||11,bold:true,color:{argb:"FF"+(o.color||"000000")}};
    x.alignment={horizontal:o.h||"left",vertical:"middle",wrapText:true};
  };
  const end=()=>{ws.getRow(r).height=Math.max(18,need);need=0;r++};
  const lab=(a,b,t,h)=>put(a,b,t,{size:10,h});
  const band=(t,c)=>{put(1,12,t,{fill:c,color:"FFFFFF",h:"center"});end()};
  put(1,4,store.get("vm:cong")||"Congregación: "+CONG,{font:"Arial",size:9,h:"center"});
  put(5,12,"Programa para la reunión de entre semana",{font:"Arial",size:12,h:"center"});end();
  cur.weeks.forEach((w,i)=>{
    const p=`vm:${ym}:${i}:`,it=n=>w.items.find(x=>x.n===n),v=k=>put(12,12,store.get(p+k),{h:"center"});
    const txt=n=>{const x=it(n);return x?`${x.n}. ${x.title} (${x.mins} mins.) ${x.detail}`:""};
    const L=/\d{4}.*\d{4}/.test(w.label)?w.label.replace(/\s*[–—-]\s*/," A "):w.label;
    put(1,10,`SEMANA: ${L} | LECTURA SEMANAL DE LA BIBLIA: ${w.reading}`,{fill:"2E75B6",color:"FFFFFF"});lab(11,11,"Presidente:");v("pres");end();
    put(1,7,`● Canción ${w.intro_song??""} y oración | Palabras de introducción (1 min.)`);put(8,10,"");lab(11,11,"Oración:");v("or1");end();
    band("TESOROS DE LA BIBLIA","575A5D");
    for(const n of [1,2,3]){put(1,10,txt(n));lab(11,11,n==3?"Estudiante:":"Conductor:");v("n"+n);end()}
    band("SEAMOS MEJORES MAESTROS","BE8900");
    for(const n of [4,5,6]){put(1,9,txt(n));lab(10,11,"Estudiante/Ayudante:","center");v("n"+n);end()}
    band("NUESTRA VIDA CRISTIANA","7E0024");
    put(1,11,`● Canción ${w.living_song??""}`,{color:"820000"});put(12,12,"");end();
    for(const n of [7,8]){put(1,9,txt(n));lab(10,11,"Conductor:","center");v("n"+n);end()}
    put(1,9,"● Palabras de conclusión (3 min.)");put(10,11,"");put(12,12,"");end();
    put(1,9,`● Canción ${w.closing_song??""} y oración`,{color:"7E0024"});lab(10,11,"Oración:","center");v("or2");end();
    r++;
  });
  const [Y,M]=ym.split("-"),buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=`Hoja - Vida y Ministerio Cristianos - ${MESES[M-1]} ${Y}.xlsx`;a.click();
}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)store.set(k,e.target.isContentEditable?e.target.innerText:e.target.value)});
const n=new Date();$("#m").value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
$("#m").addEventListener("change",load);load();
</script></body></html>
